<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Скачивания</title>
<style>:root{--bg:#f4f5f3;--fg:#15181b;--mu:#667;--rule:#d6d9d5}@media (prefers-color-scheme:dark){:root{--bg:#121417;--fg:#e8eae7;--mu:#99a;--rule:#2a2f34}}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;margin:0;padding:24px 16px}main{max-width:560px;margin:0 auto}
table{width:100%;border-collapse:collapse;margin:16px 0}td,th{padding:8px 4px;border-bottom:1px solid var(--rule);text-align:left}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tot{font-size:28px;font-weight:700}.mu{color:var(--mu);font-size:14px}</style></head><body><main>
<h1>Скачивания книг</h1><div class="tot" id="tot">…</div><table><thead><tr><th>Файл</th><th class="n">Скачиваний</th></tr></thead><tbody id="tb"></tbody></table>
<p class="mu" id="st">Данные GitHub по последнему релизу. Считаются все загрузки, включая повторные и ботов.</p></main>
<script>
fetch('https://api.github.com/repos/maidan-2014/maidan-2014.github.io/releases/latest',{headers:{Accept:'application/vnd.github+json'}})
.then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){var s=0,tb=document.getElementById('tb');
(d.assets||[]).forEach(function(a){s+=a.download_count;var tr=document.createElement('tr');tr.innerHTML='<td></td><td class="n"></td>';tr.cells[0].textContent=a.name;tr.cells[1].textContent=a.download_count;tb.appendChild(tr)});
document.getElementById('tot').textContent='Всего: '+s;document.getElementById('st').textContent+=' Обновлено: '+new Date().toLocaleString('ru-RU')+'.'})
.catch(function(e){document.getElementById('tot').textContent='Релиз пока не найден ('+e.message+')'});
</script></body></html>
